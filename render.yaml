services:
  - type: web
    name: mortgage-calculator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mortgage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
databases:
  - name: mortgage-db
    plan: basic-256mb
    databaseName: mortgage
    user: mortgage_user
